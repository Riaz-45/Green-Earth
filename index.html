<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Earth</title>

    <!-- Tailwind + DaisyUI cdn -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome CDN added -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <!-- Header Section -->
    <header>
        <div class="navbar bg-[#15803D] shadow-sm px-28">
            <div class="navbar-start">
                <div class="dropdown">
                <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                    <svg aria-label="Menu" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" /> </svg>
                </div>
                <ul
                    tabindex="-1"
                    class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
                    <li>
                        <a>About</a>
                    </li>
                    <li>
                        <a>Gallery</a>
                    </li>
                    <li>
                        <a>Plant a tree</a>
                    </li>
                </ul>
                </div>
                <a class="btn btn-ghost text-white text-xl">Green Earth</a>
            </div>
            <div class="navbar-center hidden lg:flex">
                <ul class="menu menu-horizontal text-white px-1">
                    <li><a>About</a></li>
                    <li><a>Gallery</a></li>             
                    <li><a>Plant a tree</a></li>
                </ul>
            </div>
            <div class="navbar-end">
                <button class="btn bg-[#FACC15] text-[#15803D] border-none rounded-full">Plant a tree</button>
            </div>
        </div>
    </header>

    <!-- Banner Section -->
    <section>
        <div class="grid grid-cols-3 items-center justify-between bg-[#CFF0DC]">
            <div>
                <img src="./assets/hero-leaf1.png" alt="">
            </div>
            <div class="text-center">
                <h3 class="font-bold text-4xl">Plant a Tree, Grow a Future</h3>
                <p class="text-xs mt-3 mb-5">Join our mission to plant 1 million trees and make the Earth greener for future <br>generations.</p>
                <button class="btn bg-[#FACC15] text-[#15803D] border-none rounded-full">Get Involved</button>
            </div>
            <div>
                <img src="./assets/hero-leaf2.png" alt="">
            </div>
        </div>
        
    </section>
</body>
</html>
